[package]
name = "jkcodingagent"
version = "0.2.1"
description = "An agent-first vibe coding application"
authors = []
edition = "2021"
repository = "https://github.com/diff-name-diffc/JkCodingAgent.git"
homepage = "https://github.com/diff-name-diffc/JkCodingAgent"
documentation = "https://github.com/diff-name-diffc/JkCodingAgent"
readme = "../README.md"
keywords = ["tauri", "desktop", "ai", "agent", "productivity"]
categories = ["gui", "development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jkcodingagent_lib"
# staticlib 仅供 iOS 移动端使用（tauri mobile），桌面构建不消费该产物——
# 移除后 `tauri build` 桌面链路不受影响，省去巨型 .a 的编译时间与磁盘占用。
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-clipboard-manager = "2.4.1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.58", default-features = false }
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "process"] }
portable-pty = "0.9"
chrono = "0.4"
base64 = "0.23"
toml = "1.1"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = "0.40"
async-trait = "0.1"
glob = "0.3"
walkdir = "2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }
dirs = "7"
anyhow = "1"
thiserror = "2"
ropey = "1"
sha2 = "0.11"
russh = "0.63"
# 格式白名单与运行时闸门严格对齐：mime_for_ext / sniff_image_mime 仅放行
# png/jpeg/webp/gif 四类，bmp/ico/tiff 在所有入口（粘贴、fetch 魔数嗅探、
# 保存登记）都被拒绝——文件浏览器预览直接流原始字节给 webview，不经本 crate
# 解码，因此不需要其解码器。收窄后解码失败仍走既有降级路径（原样返回/报错）。
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rmcp = { version = "3.4", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-client-unix-socket"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35"
libc = "0.2"
agent-client-protocol = "2"
rig = { package = "rig-core", version = "0.42" }
# 编排器 PTC：进程内 QuickJS，只向程序暴露数据面绑定，不提供文件、网络或进程。
rquickjs = { version = "0.9", features = ["futures", "macro", "parallel"] }

[dev-dependencies]
rmcp = { version = "3.4", default-features = false, features = ["server"] }
tokio = { version = "1", features = ["test-util"] }
# rig 官方 mock 模型（`test-utils`）：运行时循环的端到端测试用，仅测试构建启用。
rig = { package = "rig-core", version = "0.42", features = ["test-utils"] }

[profile.dev]
debug = 0
codegen-units = 256
split-debuginfo = "unpacked"
incremental = true

[profile.release]
# 体积优先（构建时间让位）：
# - strip：剥离符号表与调试信息，是 75MB 主二进制的最大单项体积来源；
# - fat LTO + codegen-units=1：跨 crate 全图内联与死代码消除，比 thin/64
#   再省 5~15%（代价是 release 链接阶段明显变慢，本图实测记录见提交说明）。
# panic 保持 unwind：Tauri/wry 依赖 catch_unwind 收敛 panic，不能改 abort。
panic = "unwind"
strip = true
lto = "fat"
codegen-units = 1
