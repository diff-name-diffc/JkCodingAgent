[project]
name = "rag-server"
version = "0.1.0"
description = "RAG sidecar service for JKCodingAgent, spawned by the Tauri host as a Python subprocess."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # HTTP 服务骨架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 配置与数据模型
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 外部依赖（仅声明，骨架阶段不实际连接）
    "qdrant-client>=1.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
# PyInstaller 打包时需要，dev 时可省
build = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_server"]

[tool.uv]
# 开发依赖（不进 PyInstaller 产物）
dev-dependencies = [
    "pytest>=8.3",
    "ruff>=0.7",
]

# ---- PyInstaller 产物名（需与 Tauri externalBin 名一致）----
# Tauri 会在运行时按 target-triple 追加后缀查找，例如：
#   rag-server-aarch64-apple-darwin
#   rag-server-x86_64-pc-windows-msvc.exe
[tool.rag-server]
binary_name = "rag-server"
