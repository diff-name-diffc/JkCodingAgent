[package]
name = "jkcodingagent"
version = "0.2.1"
description = "An agent-first vibe coding application"
authors = []
edition = "2021"
repository = "https://github.com/diff-name-diffc/JkCodingAgent.git"
homepage = "https://github.com/diff-name-diffc/JkCodingAgent"
documentation = "https://github.com/diff-name-diffc/JkCodingAgent"
readme = "../README.md"
keywords = ["tauri", "desktop", "ai", "agent", "productivity"]
categories = ["gui", "development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jkcodingagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.49.9", default-features = false }
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "process"] }
once_cell = "1.19"
portable-pty = "0.9"
chrono = "0.4"
base64 = "0.22"
notify = "8"
toml = "1.1"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = "0.39"
async-trait = "0.1"
glob = "0.3"
walkdir = "2"
futures = "0.3"
dirs = "6"
anyhow = "1"
thiserror = "2"
ropey = "1"
sha2 = "0.11"
ssh2 = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
rmcp = { version = "1.8.0", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest", "transport-streamable-http-client-unix-socket"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.34"
libc = "0.2"

[profile.dev]
debug = 0
codegen-units = 256
split-debuginfo = "unpacked"
incremental = true

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 64
