[project]
name = "rag-server"
version = "0.1.0"
description = "RAG sidecar service for JKCodingAgent, spawned by the Tauri host as a Python subprocess."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # HTTP 服务骨架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # 配置与数据模型
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # LangChain RAG 管线
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-qdrant>=1.0",
    "langchain-openai>=1.0",
    "fastembed>=0.7",
    # 文档解析与 OCR
    "rapidocr>=3.0",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "Pillow>=10.4",
    "opencv-python-headless>=4.10",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    # 外部服务
    "qdrant-client>=1.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
# PyInstaller 打包时需要，dev 时可省
build = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_server"]

[tool.uv]
# 开发依赖（不进 PyInstaller 产物）
dev-dependencies = [
    "pytest>=8.3",
    "ruff>=0.7",
]

# ---- PyInstaller 产物名（需与 Tauri externalBin 名一致）----
# Tauri 会在运行时按 target-triple 追加后缀查找，例如：
#   rag-server-aarch64-apple-darwin
#   rag-server-x86_64-pc-windows-msvc.exe
[tool.rag-server]
binary_name = "rag-server"
