[package]
name = "jkcodingagent"
version = "0.2.1"
description = "An agent-first vibe coding application"
authors = []
edition = "2021"
repository = "https://github.com/diff-name-diffc/JkCodingAgent.git"
homepage = "https://github.com/diff-name-diffc/JkCodingAgent"
documentation = "https://github.com/diff-name-diffc/JkCodingAgent"
readme = "../README.md"
keywords = ["tauri", "desktop", "ai", "agent", "productivity"]
categories = ["gui", "development-tools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jkcodingagent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "process"] }
once_cell = "1.19"
portable-pty = "0.8"
chrono = "0.4"
base64 = "0.22"
notify = "6"
toml = "0.8"
libc = "0.2"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
glob = "0.3"
futures = "0.3"
dirs = "6"
anyhow = "1"
ropey = "1"

[profile.dev]
debug = 0
